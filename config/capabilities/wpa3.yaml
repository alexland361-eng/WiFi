# WPA3 / Dragonblood posture audits
- name: hostapd_wpa3_audit
  tool_binary: hostapd_cli
  category: wpa_assessment
  description: "Read hostapd WPA3/SAE configuration through its control socket"
  requirements:
    os: [linux]
    interface_required: true
    privileges: []

- name: wpa_supplicant_wpa3_audit
  tool_binary: wpa_cli
  category: wpa_assessment
  description: "Read wpa_supplicant WPA3/SAE configuration through its control socket"
  requirements:
    os: [linux]
    interface_required: true
    privileges: []

- name: wpa_supplicant_wpa3_status
  tool_binary: wpa_cli
  category: wpa_assessment
  description: "Observe the SAE group selected by an existing connection"
  requirements:
    os: [linux]
    interface_required: true
    privileges: []

- name: sae_capture_analysis
  tool_binary: tshark
  category: wpa_assessment
  description: "Offline SAE group and authentication analysis from an existing capture"
  requirements:
    os: [linux]
    interface_required: false
    privileges: []
