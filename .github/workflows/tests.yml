name: tests

# Unit tests run anywhere. The wireless job needs a kernel that can load
# mac80211_hwsim, which GitHub-hosted runners have and this project's dev
# sandbox does not (CONFIG_MODULES is not set there).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `full` pulls scapy, an optional dependency. Installing it means the
          # Scapy adapter tests run rather than skip, which matters because that
          # adapter is where the arbitrary-code-execution defect was found.
          pip install -e ".[full]"
          pip install pytest pytest-cov

      - name: Run test suite
        run: python -m pytest -q

      # Ratcheted at the measured figure rather than an aspirational one: 69.13% with scapy
      # (this job installs `.[full]`), 68.78% without.
      #
      # 68, not 69 - even though the total now clears 69 here. pytest-cov makes the
      # fail-under decision twice and the two disagree: the exit code uses
      # `round(total, precision=0) < fail_under`, while the terminal message uses the raw
      # comparison. A threshold between the two environments' totals therefore yields, in the
      # no-scapy one, a red "FAIL Required test coverage of 69% not reached. Total coverage:
      # 68.78%" *and* exit status 0 - a gate that reports failure while passing, which is
      # worse than no gate. 68 is the highest threshold at which both agree in both
      # environments, giving an effective floor of 67.5%. Measured, not inferred, in all four
      # combinations: with scapy at 68 (rc=0, green) and 69 (rc=0, green); without scapy at
      # 68 (rc=0, green) and 69 (rc=0, RED). Re-check both when raising this.
      - name: Coverage
        run: python -m pytest -q --cov=wifi_framework --cov-report=term-missing --cov-fail-under=68

  # Lint and type gate. ruff is blocking on everything the project selects except the
  # two categories recorded as deferred debt in pyproject.toml (E501 line length, C901
  # complexity), each with the count measured when the gate was introduced. mypy is
  # gated against growth rather than against zero: the 34 remaining findings are
  # recorded in .mypy-baseline, so new ones fail the build and the file is lowered when
  # old ones are fixed. A gate that fails on day one is a gate nobody runs.
  quality-gate:
    name: lint and type gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      - name: Ruff
        run: ruff check src tests scripts --output-format=github

      - name: Mypy baseline
        run: python scripts/check_type_baseline.py

  wireless-hardware:
    name: wireless verification (mac80211_hwsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install wireless tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iw rfkill macchanger ethtool aircrack-ng
          iw --version
          macchanger --version | head -1
          airmon-ng --help 2>&1 | head -2 || true

      # mac80211_hwsim lives in linux-modules-extra on Ubuntu. Try the load
      # first (runner images sometimes ship it), then install and retry.
      # Diagnostics are emitted as annotations because job logs live in blob
      # storage that is not always reachable from the environment reading them.
      - name: Load mac80211_hwsim
        run: |
          KREL=$(uname -r)
          echo "kernel release: $KREL"

          CFG="/boot/config-$KREL"
          if [ -r "$CFG" ]; then
            for opt in CONFIG_MODULES CONFIG_WIRELESS CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_MAC80211_HWSIM; do
              line=$(grep -E "^(${opt}=|# ${opt} )" "$CFG" || echo "${opt} absent from config")
              echo "  $line"
              echo "::notice title=kernel-config::${line}"
            done
          else
            echo "  no kernel config at $CFG"
            echo "::notice title=kernel-config::no /boot/config-$KREL on runner"
          fi

          attempt() {
            echo "--- modprobe attempt: $*"
            if out=$(sudo modprobe "$@" 2>&1); then
              echo "  SUCCESS"
              return 0
            fi
            echo "  FAILED: $out"
            echo "::error title=modprobe-failed::$out"
            LAST_ERR="$out"
            return 1
          }

          if attempt mac80211_hwsim radios=2; then
            echo "loaded on first attempt"
          else
            echo "installing module package for $KREL"
            sudo apt-get install -y "linux-modules-extra-$KREL" 2>&1 | tail -5 || true
            sudo depmod -a "$KREL" || true
            echo "searching for the module file:"
            find /lib/modules -name 'mac80211_hwsim*' 2>/dev/null | head -5 || echo "  (none found)"
            attempt mac80211_hwsim radios=2 || {
              echo "not shipped by the distro for this kernel; building out-of-tree"
              echo "::notice title=hwsim::distro package lacks hwsim on $KREL, building from kernel source"
              bash scripts/build_hwsim.sh "$KREL"
            }
          fi

          lsmod | grep -E 'hwsim|mac80211|cfg80211' || echo "WARNING: modules not visible in lsmod"


      - name: Confirm virtual radios exist
        run: |
          iw dev
          test -d /sys/class/ieee80211 || { echo "FATAL: no cfg80211 phy present"; exit 1; }
          count=$(iw dev | grep -c 'Interface' || true)
          echo "wireless interfaces found: $count"
          test "$count" -ge 1 || { echo "FATAL: hwsim created no interfaces"; exit 1; }

      - name: Install framework
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"
          python -c "import scapy; print('scapy', scapy.__version__)"

      - name: Verify InterfaceManager against the virtual radio
        run: |
          set +e
          # sudo resets PATH via secure_path, which would hide iw/rfkill/macchanger
          # from the script's subprocess calls. GITHUB_ACTIONS must be passed
          # explicitly too, or the script cannot tell it is in CI and stays silent
          # about its findings.
          sudo env PATH="$PATH" GITHUB_ACTIONS=true \
            "$(which python)" scripts/verify_wireless_hardware.py 2>&1 \
            | tee wireless-verification.log
          code=${PIPESTATUS[0]}
          set -e
          echo "verification exit code: $code"
          exit "$code"

      # Independent of the script's own annotations: if the Python side ever
      # fails to emit them, the log still carries the findings.
      - name: Surface failures from the log
        if: always()
        run: |
          if [ ! -f wireless-verification.log ]; then echo "no log produced"; exit 0; fi

          echo "--- environment ---"
          grep -E '^(kernel:|mac80211_hwsim loaded:|physical devices|wireless interfaces:|  wlan)' \
            wireless-verification.log || true

          echo "--- result line ---"
          summary=$(grep -E '^RESULT:' wireless-verification.log | head -1 | tr -d '\n' || true)
          echo "${summary:-no RESULT line found}"
          if [ -n "$summary" ]; then
            echo "::notice title=verification-summary::${summary}"
          fi

          echo "--- failed checks with claimed vs observed ---"
          grep -A3 '\[FAIL\]' wireless-verification.log | sed 's/^[[:space:]]*//' || true

          fails=$(grep -A3 '\[FAIL\]' wireless-verification.log | sed 's/^[[:space:]]*//' | tr '\n' ' ' | tr -s ' ' || true)
          if [ -n "$fails" ]; then
            echo "::error title=failed-checks::$(echo "$fails" | cut -c1-900)"
          fi


      # Two hwsim radios forward frames to each other, so this exercises the
      # path InterfaceManager verification does not: raw AF_PACKET sockets,
      # Scapy sniffing, actual transmission, and the framework's ScapyAdapter.
      - name: Verify raw capture and frame injection between two radios
        run: |
          set +e
          sudo env PATH="$PATH" GITHUB_ACTIONS=true \
            "$(which python)" scripts/verify_scapy_capture.py 2>&1 \
            | tee scapy-capture.log
          code=${PIPESTATUS[0]}
          set -e
          echo "capture/injection exit code: $code"
          exit "$code"

      - name: Surface capture and injection results
        if: always()
        run: |
          if [ ! -f scapy-capture.log ]; then echo "no log produced"; exit 0; fi
          grep -E '^(wireless interfaces:|capture on|unique marker|  independent raw capture)' \
            scapy-capture.log || true
          summary=$(grep -E '^RESULT:' scapy-capture.log | head -1 | tr -d '\n' || true)
          echo "${summary:-no RESULT line found}"
          if [ -n "$summary" ]; then
            echo "::notice title=capture-injection-summary::${summary}"
          fi
          echo "--- failed checks ---"
          grep -A1 '\[FAIL\]' scapy-capture.log | sed 's/^[[:space:]]*//' || true
          fails=$(grep -A1 '\[FAIL\]' scapy-capture.log | sed 's/^[[:space:]]*//' | tr '\n' ' ' | tr -s ' ' || true)
          if [ -n "$fails" ]; then
            echo "::error title=capture-failed-checks::$(echo "$fails" | cut -c1-900)"
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wireless-verification-logs
          path: |
            wireless-verification.log
            scapy-capture.log
          if-no-files-found: warn
