[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-framework"
version = "0.5.1"
description = "Real Wi-Fi penetration-testing and security-assessment framework with adaptive, evidence-driven orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "WiFi Framework Team"}
]
keywords = ["wifi", "penetration-testing", "security", "wireless", "kali"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking"
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
full = [
    "scapy>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/alexland361-eng/WiFi"
Repository = "https://github.com/alexland361-eng/WiFi"
Issues = "https://github.com/alexland361-eng/WiFi/issues"

[project.scripts]
wifi-assess = "wifi_framework.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
# Allow ``pytest`` to run from a clean checkout without a prior ``pip install -e .``.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []
